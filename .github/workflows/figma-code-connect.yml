# Publishes the Code Connect templates in figma/ to the Figma library on every merge to main.
# Setup: add a Figma personal access token (scopes: Code Connect write, File content read)
# as the repository secret FIGMA_ACCESS_TOKEN.
name: Figma Code Connect

on:
  push:
    branches: [main]
    paths:
      - 'figma/**'
      - 'figma.config.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'techuiux/dga-components' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish templates
        run: npx --yes @figma/code-connect@2 connect publish --skip-update-check
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
